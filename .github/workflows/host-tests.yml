# Host tests: everything about this library that can be checked without an MCU.
#
# The whole suite is driven by Test/host/Makefile, deliberately. CI running the
# same command a developer runs is what stops the two drifting apart - a suite
# that passes locally passes here, and adding a suite to that Makefile adds it
# to CI with no change to this file.
#
# Nothing here needs a cross-compiler, a HAL, a vendor IDE or a device. The
# modules under test either depend on nothing but the C library, or reach the
# platform only through the contract in log_and_stream_externs.h, which
# Test/host/stubs implements for a PC. See Test/host/stubs/README.md.
#
# WHAT THIS DOES NOT COVER, and must not be mistaken for:
#   - The MSP430 and STM32 builds themselves. The host compiler has a 32-bit
#     int; the MSP430's is 16. An expression that overflows on Shimmer3 is
#     silently correct here.
#   - Anything involving real peripherals, timing, power or radio.
# Both are release gates in docs/SHIMMER3_TEST_PROCEDURE.md. This workflow is
# the fast layer underneath them, not a substitute for either.

name: host-tests

on: [push, pull_request]

permissions:
  contents: read

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Compile every host-clean module for BOTH platforms before running
      # anything. This library is a submodule of both shimmer3-firmware
      # (MSP430) and shimmer3r-firmware (STM32U5), and AGENTS.md calls that the
      # single most important thing to hold in mind here: nothing in this repo
      # tells you at edit time that a change has broken the other one. This is
      # the cheapest check that it has not.
      #
      # It runs first because its failure mode - a symbol used outside the #if
      # that defines it - makes the test results below meaningless anyway.
      - name: Compile for both platforms
        run: make -C Test/host platform-check

      - name: Run host tests
        run: make -C Test/host test

      # The suite prints a per-case report; on failure it is the only place the
      # failing assertion names itself, so surface it in the job summary rather
      # than making someone open the log.
      - name: Report
        if: always()
        run: |
          {
            echo "### Host tests"
            echo ""
            echo "Run locally with \`make -C Test/host\`."
          } >> "$GITHUB_STEP_SUMMARY"
