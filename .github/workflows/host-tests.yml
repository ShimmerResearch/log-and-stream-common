name: host-tests

on: [push, pull_request]

jobs:
  software-crc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # shimmer_swCrc.c includes only shimmer_swCrc.h and shimmer_crc.h, and
      # both include nothing but <stdint.h> - so this needs no ARM toolchain,
      # no HAL and no target hardware.
      #
      # -DSHIMMER_HOST_TEST is what un-hides main() in test_swcrc.c. The
      # firmware projects compile every .c under this repository, so the test's
      # main() stays behind that guard for everyone except this job.
      - name: Build
        run: >
          gcc -std=c11 -O2 -Wall -Wextra -Werror -DSHIMMER_HOST_TEST
          -I CRC
          Test/host/test_swcrc.c CRC/shimmer_swCrc.c
          -o /tmp/test_swcrc

      - name: Assertions
        run: /tmp/test_swcrc

      - name: Cross-check against the Python host reference
        run: python3 Test/host/crosscheck_swcrc.py /tmp/test_swcrc

  packet-ring:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # shimmer_packet_ring.c includes only <stdint.h> and <string.h>, so the
      # ring's state machine can be driven on a PC. That matters here more than
      # it does for the CRC: the interleavings this covers need a sample timer,
      # a gather completion and an SD write to land in a particular order, which
      # is not something you can ask real hardware for.
      #
      # -DSHIMMER_HOST_TEST is what un-hides main() in test_packet_ring.c. The
      # firmware projects compile every .c under this repository, so the test's
      # main() stays behind that guard for everyone except this job.
      - name: Build
        run: >
          gcc -std=c11 -O2 -Wall -Wextra -Werror -DSHIMMER_HOST_TEST
          -I .
          Test/host/test_packet_ring.c Sensing/shimmer_packet_ring.c
          -o /tmp/test_packet_ring

      - name: Assertions
        run: /tmp/test_packet_ring

  sd-write-buf:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The number of buffers is a compile-time constant, so the same test is
        # built once per count: 1 is what Shimmer3 shipped and pins down the
        # records that cost, 2 is Shimmer3 now, 4 is Shimmer3R.
        numbufs: [1, 2, 4]
    steps:
      - uses: actions/checkout@v4

      # shimmer_sd_write_buf.c includes only <stdint.h> and <string.h>, so the
      # buffer state machine can be driven on a PC. The states worth testing -
      # a buffer filling while the previous one is still going to the card, a
      # stop arriving while every buffer is queued - need a card slower than
      # the sample rate, which is not something you can ask hardware for.
      #
      # -DSHIMMER_HOST_TEST is what un-hides main() in test_sd_write_buf.c. The
      # firmware projects compile every .c under this repository, so the test's
      # main() stays behind that guard for everyone except this job.
      - name: Build (NUM_SDWRBUF=${{ matrix.numbufs }})
        run: >
          gcc -std=c11 -O2 -Wall -Wextra -Werror -DSHIMMER_HOST_TEST
          -DNUM_SDWRBUF=${{ matrix.numbufs }}
          -I .
          Test/host/test_sd_write_buf.c SDCard/shimmer_sd_write_buf.c
          -o /tmp/test_sd_write_buf

      - name: Assertions
        run: /tmp/test_sd_write_buf
