# Shimmer3R release matrix. One [[row]] per configuration; each is a report
# item release.<id>. Generated to cover every pair of (rate, sensor set),
# (rate, mode), (set, mode) and (mode, CRC), then hand-extended with long logs.
#
#   mode    stream = Bluetooth only, docked; log = SD only, undocked by the hub
#           port; both = START_SDBT undocked, stream checked against the log
#   crc     Bluetooth CRC mode 0/1/2 (stream and both only)
#   ranges  configuration codes (INFOMEM §4): ln_accel 0-3 = ±2/4/8/16 g,
#           gyro 0-5 = ±125/250/500/1000/2000/4000 dps, wr_accel 0-3 = ±2/4/8/16 g

[sets]
imu = ["ln_accel", "gyro", "mag", "vbatt"]
imu_wr = ["ln_accel", "gyro", "mag", "vbatt", "wr_accel"]
imu_press = ["ln_accel", "gyro", "mag", "vbatt", "pressure"]
full = ["ln_accel", "gyro", "mag", "vbatt", "wr_accel", "alt_accel", "alt_mag", "pressure", "gsr"]

[[row]]
id = "imu_51p2hz_stream"
rate_hz = 51.2
sensors = "imu"
mode = "stream"
crc = 0
seconds = 20
ln_accel_range = 0
gyro_range = 0
wr_accel_range = 0

[[row]]
id = "imu_wr_51p2hz_log"
rate_hz = 51.2
sensors = "imu_wr"
mode = "log"
seconds = 30
ln_accel_range = 1
gyro_range = 1
wr_accel_range = 1

