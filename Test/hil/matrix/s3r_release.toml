# The event channel (DEV-971). Every row writes byte 232, button_log_mode
# (INFOMEM §8.3), 0 when the row has none. These rows set it to record an
# input, so each log must have an event file beside its data file, holding only
# state records - nothing touches the button or the TTL input on the bench -
# with a heartbeat at least every two minutes (EVENT_CHANNEL §4.3). 0x24 is a
# double press to start and stop, every press recorded, and the TTL input; 0x20
# the TTL input alone; 0x05 every press recorded and nothing else. Log and both
# rows only: a stream writes no event file.
[[row]]
id = "events_btn_ttl_51p2hz_log"
rate_hz = 51.2
sensors = "imu"
mode = "log"
seconds = 30
ln_accel_range = 1
gyro_range = 3
wr_accel_range = 2
button_log_mode = 0x24

[[row]]
id = "events_ttl_256hz_both"
rate_hz = 256
sensors = "imu_wr"
mode = "both"
crc = 2
seconds = 30
ln_accel_range = 3
gyro_range = 0
wr_accel_range = 1
button_log_mode = 0x20

[[row]]
id = "events_btn_512hz_log_3min"
rate_hz = 512
sensors = "full"
mode = "log"
seconds = 180
ln_accel_range = 0
gyro_range = 4
wr_accel_range = 3
button_log_mode = 0x05

# Long logs at the top rates, for periodic stalls (card busy time, flushes)
# that a 30 s log rarely meets.
[[row]]
id = "imu_1024hz_log_5min"
rate_hz = 1024
sensors = "imu"
mode = "log"
seconds = 300
ln_accel_range = 0
gyro_range = 1
