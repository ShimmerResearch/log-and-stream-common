# Bench description for the hardware-in-the-loop suite. Copy to rig.toml (or
# anywhere, and point --rig or $HIL_RIG at it) and describe what this bench has.
#
# Name hardware by something that survives a reboot: MACs, USB serial numbers,
# hub ports. Never COM numbers or drive letters - Windows reassigns them.
#
# Leave out what the bench does not have. A test needing it is reported as
# not_covered, so the gate looks for that item in another bench's report.

bench = "my-bench"            # appears in the report; one name per physical bench

[hub]
# Exsys EX-1594HMS managed hub. The control chip's FTDI serial, as printed by
# `python hub/hubctl.py list` in bench-tools. Omit this table without a hub:
# the docking tests are then reported not_covered, unless the run is given
# --manual-power, which prompts the operator to plug and unplug instead.
serial = "ABCD1234"

[base6]
# Base6 dock (FT4232) for Shimmer3 units: its FTDI serial without the channel
# letter (`python -m serial.tools.list_ports -v` lists <serial>A..D). Omit
# without one: the fleet tier then reports its items not_covered.
serial = "ABCDEFGH"

[tools]
bench_tools = "C:/dev/bench-tools"     # checkout providing hub/hubctl.py
stm32_programmer = "C:/Program Files/STMicroelectronics/STM32Cube/STM32CubeProgrammer/bin/STM32_Programmer_CLI.exe"
# An ST-Link flashes by SWD instead of USB DFU. It reaches one unit's SWD
# header, so with more than one Shimmer3R give each [[unit]] its own
# stlink_serial; this bench-wide one is only for a bench with one.
# stlink_serial = "<ST-Link serial from STM32_Programmer_CLI -l st-link>"

[[unit]]
name = "s3r-a"
platform = "shimmer3r"
mac = "AABBCCDD0001"           # Bluetooth MAC
usb_serial = "0123456789AB"    # USB iSerial: `python -m serial.tools.list_ports -v`, VID:PID 0483:5710
hub_port = 1                   # hub port powering its USB-C (power-off = undock)
radio = "IF820 v1.4.16.16"
board = ""
notes = ""
# stlink_serial = "..."        # the ST-Link on this unit's SWD header: flash and reset by SWD, not
#                              # through ST's bootloader, which on occasion never comes back as DFU
# throughput = { ... }         # as for the Shimmer3 below; smoke.bt_throughput reads it

# One Shimmer3 per radio firmware that shipped: RN42 v4.77, RN42 v6.15,
# RN4678 v1.00.5, RN4678 v1.23. Pair each one's classic side in Windows.
[[unit]]
name = "s3-rn42-615"
platform = "shimmer3"
mac = "000666AABBCC"
base6_slot = 3
radio = "RN42 Ver 6.15"
# What the last release gave on this unit and bench, for fleet.bt_throughput.
# Without it the item is not_covered, and its reason prints this line with the
# figures it measured. Record them from a run of the release, not a candidate.
# throughput = { link_bytes_per_s = 28900, stream_samples_per_s = 842 }

[triage]
# For triage.py. Keep issue keys out of this public repo: the known-issues file
# belongs to the bench (bench-tools hil/known_issues.md on ours).
# known_issues = "C:/dev/bench-tools/hil/known_issues.md"
# source_dirs = ["C:/dev/stm32/shimmer3r-firmware", "C:/dev/msp430/shimmer3-firmware"]
# budget_usd = 2.0
# claude = "C:/path/to/claude.exe"      # default: PATH, then the Claude desktop app's copy
# bench_facts = """
# - anything about this bench that can masquerade as a firmware fault
# """
